<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="desc">
  <desc id="desc">矩形 RGB 图像的宽为 W pixels、w mm，高为 H pixels、h mm，圆形接触印迹的直径为 2r_c。图像坐标 x 向右，y 向下。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#111" stroke-width="1.4"/></marker>
    <marker id="dimension" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M7 1L1 4L7 7" fill="none" stroke="#111" stroke-width="1.3"/></marker>
  </defs>
  <rect width="1100" height="650" fill="white"/>
  <g font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" fill="#111" font-size="28">
    <g fill="none" stroke="#111" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M105 262H207" marker-end="url(#arrow)"/>
      <path d="M105 262V364" marker-end="url(#arrow)"/>
      <rect x="280" y="170" width="500" height="350"/>
      <circle cx="530" cy="345" r="66"/>
      <path d="M280 142V116M780 142V116M808 170H839M808 520H839M464 426V450M596 426V450" stroke-width="2"/>
      <path d="M280 129H780" stroke-width="2" marker-start="url(#dimension)" marker-end="url(#dimension)"/>
      <path d="M825 170V520" stroke-width="2" marker-start="url(#dimension)" marker-end="url(#dimension)"/>
      <path d="M464 438H596" stroke-width="2" marker-start="url(#dimension)" marker-end="url(#dimension)"/>
    </g>
    <text x="223" y="271" font-family="Segoe UI, sans-serif" font-size="30" font-style="italic">x</text>
    <text x="96" y="402" font-family="Segoe UI, sans-serif" font-size="30" font-style="italic">y</text>
    <text x="365" y="95">W pixels, w mm</text>
    <text x="861" y="334">H pixels</text>
    <text x="861" y="379">h mm</text>
    <text x="507" y="480" font-family="Segoe UI, sans-serif" font-size="29" font-style="italic">2r<tspan baseline-shift="sub" font-size="21">c</tspan></text>
    <text x="347" y="589">成像 (r, g, b)<tspan baseline-shift="sub" font-size="22">3×H×W</tspan></text>
  </g>
</svg>
