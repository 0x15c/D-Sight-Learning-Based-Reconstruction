    <g text-anchor="start" font-size="22">
      <text x="45" y="675">ConvBlock　两组 3×3 卷积与 LeakyReLU(0.2)</text>
      <text x="45" y="709">Pool　2×2 最大池化　　 Up　2×2 转置卷积（步长 2）　　 C　基础通道数</text>
      </g>
    <path d="M35 766H1375" stroke="#999" stroke-width="1" transform="translate(0 -38)" />
    <g fill="white" stroke="#111" stroke-width="2.2" transform="translate(0 -38)">
      <rect x="35" y="800" width="135" height="100" />
      <rect x="220" y="800" width="135" height="100" />
      <rect x="405" y="800" width="145" height="100" />
      <rect x="610" y="800" width="230" height="100" />
      <rect x="890" y="800" width="180" height="100" />
      <rect x="1120" y="800" width="255" height="100" />
      <rect x="610" y="968" width="135" height="68" />
      <rect x="805" y="968" width="195" height="68" />
    </g>
    <g font-size="23" transform="translate(0 -38)">
      <text x="102" y="836">RGB</text><text x="102" y="872" font-size="19">B×3×H×W</text>
      <text x="287" y="858">U-Net</text>
      <text x="477" y="836">g = (p, q)</text><text x="477" y="872" font-size="19">B×2×H×W</text>
      <text x="725" y="836">可微 Poisson Solver</text><text x="725" y="872" font-size="20">边界处理 + 高度参考 R</text>
      <text x="980" y="836" font-size="22">预测深度</text><text x="980" y="872" font-size="19">B×H×W</text>
      <text x="1247" y="836">深度 MSE</text>
      <text x="1247" y="872" font-size="19">mean[(预测深度 − R(f))²]</text>
      <text x="677" y="994" font-size="21">真实深度 f</text><text x="677" y="1022" font-size="19">B×H×W</text>
      <text x="902" y="994" font-size="22">高度参考 R</text><text x="902" y="1022" font-size="21">R(f)</text>
    </g>
    <g fill="none" stroke="#111" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)" transform="translate(0 -38)">
      <path d="M170 832H220" />
