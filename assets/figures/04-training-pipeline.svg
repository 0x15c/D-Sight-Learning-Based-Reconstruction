      <rect x="1010" y="235" width="230" height="74" />
      <rect x="1010" y="385" width="230" height="74" />
      <rect x="1040" y="177" width="170" height="40" />
      <rect x="1040" y="327" width="170" height="40" />
      <rect x="1040" y="477" width="170" height="40" />
      <circle cx="960" cy="122" r="22" />
      <circle cx="960" cy="272" r="22" />
      <circle cx="960" cy="422" r="22" />
      <rect x="1265" y="85" width="110" height="74" />
      <rect x="1265" y="210" width="110" height="44" />
    </g>
    <g font-size="22">
      <text x="235" y="43">RGB · B×3×H×W</text>
      <text x="235" y="113">enc1 · ConvBlock</text><text x="235" y="143" font-size="24">3 → C</text>
      <text x="235" y="263">enc2 · ConvBlock</text><text x="235" y="293" font-size="24">C → 2C</text>
      <text x="235" y="413">enc3 · ConvBlock</text><text x="235" y="443" font-size="24">2C → 4C</text>
      <text x="235" y="204">Pool 1</text><text x="235" y="354">Pool 2</text><text x="235" y="504">Pool 3</text>
      <text x="675" y="583">瓶颈 · ConvBlock</text><text x="675" y="613" font-size="24">4C → 8C</text>
      <text x="1125" y="113">dec1 · ConvBlock</text><text x="1125" y="143" font-size="24">2C → C</text>
      <text x="1125" y="263">dec2 · ConvBlock</text><text x="1125" y="293" font-size="24">4C → 2C</text>
      <text x="1125" y="413">dec3 · ConvBlock</text><text x="1125" y="443" font-size="24">8C → 4C</text>
      <text x="1125" y="204" font-size="21">Up 1 · 2C → C</text>
      <text x="1125" y="354" font-size="21">Up 2 · 4C → 2C</text>
      <text x="1125" y="504" font-size="21">Up 3 · 8C → 4C</text>
      <text x="960" y="128" font-size="16">拼接</text>
      <text x="960" y="278" font-size="16">拼接</text>
      <text x="960" y="428" font-size="16">拼接</text>
      <text x="1320" y="110" font-size="19">3×3 卷积</text>
      <text x="1320" y="140" font-size="22">C → 2</text>
      <text x="1320" y="239" font-size="24">(p, q)</text>
      <text x="1320" y="283" font-size="18">B×2×H×W</text>
      <text x="635" y="107" font-size="21">跳跃连接 · C</text>
      <text x="635" y="257" font-size="21">跳跃连接 · 2C</text>
      <text x="635" y="407" font-size="21">跳跃连接 · 4C</text>
    </g>
    <g fill="none" stroke="#111" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)">
