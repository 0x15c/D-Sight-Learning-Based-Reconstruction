      <path d="M890 870H840" />
      <path d="M610 870H550" />
      <path d="M405 870H355" />
    </g>
    <g text-anchor="start" font-size="21" transform="translate(0 -38)">
      <text x="45" y="990">实线　正向计算</text>
      <text x="45" y="1023">虚线　反向传播</text>
    </g>
  </g>
</svg>
