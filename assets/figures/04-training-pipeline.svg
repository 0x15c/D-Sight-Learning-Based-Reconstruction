<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1022" viewBox="0 0 1400 1022" role="img" aria-labelledby="desc">
  <desc id="desc">U-Net 左侧为编码器、右侧为解码器，同层特征水平跳跃连接。三个解码阶段均先进行转置卷积上采样，再与对应编码特征拼接，最后经过 ConvBlock。底部是瓶颈。训练时预测梯度通过含边界和高度参考的可微 Poisson Solver 得到预测深度，再与采用同一高度参考的真实深度计算标量 MSE。实线和虚线使用平行端口，分别表示正向计算和反向传播；真实深度分支只有正向计算。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#111" stroke-width="1.35" /></marker>
  </defs>
  <rect width="1400" height="1022" fill="white" />
  <g font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" fill="#111" text-anchor="middle">
    <g fill="white" stroke="#111" stroke-width="2.2">
      <rect x="130" y="15" width="210" height="42" />
      <rect x="130" y="85" width="210" height="74" />
      <rect x="130" y="235" width="210" height="74" />
      <rect x="130" y="385" width="210" height="74" />
      <rect x="170" y="177" width="130" height="40" />
